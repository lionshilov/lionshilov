name: Metrics

on:
  # Regenerate daily at 00:30 UTC
  schedule:
    - cron: "30 0 * * *"
  # Also regenerate on any push to main (so README changes pick up fresh stats)
  push:
    branches: [main]
  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Self-hosted SVG — no external runtime dependency.
          filename: metrics.svg
          # Prefer METRICS_TOKEN (a classic PAT with public_repo or full repo scope) —
          # it's required for cross-repo plugins like languages, habits, topics, achievements.
          # Falls back to GITHUB_TOKEN, which only sees this single repo.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: lionshilov

          # Appearance
          template: classic
          base: "header, activity, community, repositories, metadata"
          base_indepth: yes          # deeper cross-repo analysis (uses PAT scope fully)
          config_timezone: Europe/Moscow

          # Languages — what the user codes in, across all accessible repos
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake,
            gnuplot, shellsession, batchfile, powershell, markdown, scss
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5

          # Lines of code added / removed
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4

          # Open/closed PRs and issues across owned repos
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes

          # Topics the user is visibly proficient in (derived from repo topics)
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_limit: 15

          # plugin_habits — DISABLED: upstream bug, destructures author of undefined
          # plugin_achievements — DISABLED: upstream bug, relies on deprecated Projects (classic) API
